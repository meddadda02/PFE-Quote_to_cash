<template>
    <!-- ORDER HEADER -->
    <div class="cpq-header">
        <div class="cpq-header-left">
            <span class="cpq-header-live-dot"></span>
            <span class="cpq-header-title">{lbl.orderInterfaceTitle}</span>
        </div>
        <div class="cpq-header-right">
            <span class="cpq-quote-badge">{lbl.orderCreatedPrefix} {orderNumber}</span>
            <span class="cpq-currency-badge">{selectedCurrency}</span>
            <div class="cpq-user-pill">
                <div class="cpq-user-avatar">{userInitials}</div>
                <span class="cpq-user-name">{selectedAccountName}</span>
            </div>
        </div>
    </div>

    <!-- CPQ FLOW PROGRESS TRACKER -->
    <div class="cpq-ptrack">
        <div class="cpq-ptrack-shimmer"></div>
        <div class="cpq-pstep cpq-pstep-done">
            <div class="cpq-pstep-pill">
                <span class="cpq-pstep-icon">✓</span>
                <span class="cpq-pstep-text">
                    <span class="cpq-pstep-label">{lbl.stepQuoteCreated}</span>
                    <span class="cpq-pstep-num">01</span>
                </span>
            </div>
        </div>
        <div class="cpq-pconn cpq-pconn-done"></div>
        <div class="cpq-pstep cpq-pstep-done">
            <div class="cpq-pstep-pill">
                <span class="cpq-pstep-icon">✓</span>
                <span class="cpq-pstep-text">
                    <span class="cpq-pstep-label">{lbl.stepConfigurePrice}</span>
                    <span class="cpq-pstep-num">02</span>
                </span>
            </div>
        </div>
        <div class="cpq-pconn cpq-pconn-done"></div>
        <div class="cpq-pstep cpq-pstep-done">
            <div class="cpq-pstep-pill">
                <span class="cpq-pstep-icon">✓</span>
                <span class="cpq-pstep-text">
                    <span class="cpq-pstep-label">{lbl.stepMarkOrdered}</span>
                    <span class="cpq-pstep-num">03</span>
                </span>
            </div>
        </div>
        <div class="cpq-pconn" class:cpq-pconn-done={isOrderActivated}></div>
        <div class="cpq-pstep" class:cpq-pstep-active={isOrderActivating} class:cpq-pstep-done={isOrderActivated}>
            <div class="cpq-pstep-pill">
                <span class="cpq-pstep-icon">
                    <template if:true={isOrderActivated}>✓</template>
                    <template if:false={isOrderActivated}>4</template>
                </span>
                <span class="cpq-pstep-text">
                    <span class="cpq-pstep-label">{lbl.stepActivateOrder}</span>
                    <span class="cpq-pstep-num">04</span>
                </span>
            </div>
        </div>
        <div class="cpq-pconn" class:cpq-pconn-done={isContracted}></div>
        <div class="cpq-pstep" class:cpq-pstep-done={isContracted}>
            <div class="cpq-pstep-pill">
                <span class="cpq-pstep-icon">
                    <template if:true={isContracted}>✓</template>
                    <template if:false={isContracted}>5</template>
                </span>
                <span class="cpq-pstep-text">
                    <span class="cpq-pstep-label">{lbl.stepContract}</span>
                    <span class="cpq-pstep-num">05</span>
                </span>
            </div>
        </div>
    </div>

    <div class="cpq-order-view">

        <!-- BACK TO QUOTE LINK -->
        <div class="slds-m-bottom_medium">
            <button type="button" class="cpq-link-btn" onclick={handleBackToQuote}>
                {lbl.backToQuoteLink} {quoteName}
            </button>
        </div>

        <!-- ORDER STATUS PANEL -->
        <div class="cpq-order-status-panel">
            <div class="cpq-order-status-row">
                <span class="cpq-order-status-label">{lbl.orderStatusLabel}</span>
                <span class="cpq-order-status-value cpq-status-badge" data-status={orderStatus}>
                    {orderStatus}
                </span>
                <span class="cpq-order-status-label slds-m-left_medium">{lbl.orderNumberLabel}</span>
                <span class="cpq-order-status-value">{orderNumber}</span>
            </div>

            <!-- STATUS CHANGE — Step 4: activate the order -->
            <template if:false={isOrderActivated}>
                <div class="cpq-order-activate-block slds-m-top_medium">
                    <p class="cpq-order-activate-hint">
                        {lbl.activateHint}
                    </p>
                    <lightning-combobox label={lbl.setOrderStatusLabel} value={orderStatus} options={orderStatusOptions} onchange={handleOrderStatusChange} class="slds-m-bottom_small">
                    </lightning-combobox>
                    <lightning-button label={lbl.saveOrderStatusBtn} variant="brand" icon-name="utility:save" onclick={handleSaveOrderStatus} disabled={isLoading}>
                    </lightning-button>
                </div>
            </template>

            <template if:true={isOrderActivated}>
                <div class="cpq-order-activated-badge slds-m-top_small">
                    <lightning-icon icon-name="utility:success" size="small" class="slds-m-right_x-small"></lightning-icon>
                    {lbl.orderActivatedMsg}
                </div>
            </template>
        </div>

        <!-- ORDER PRODUCTS TABLE -->
        <div class="cpq-order-products slds-m-top_medium">
            <h3 class="cpq-panel-title">{lbl.orderProductsTitle}</h3>
            <template if:true={hasOrderLines}>
                <table class="cpq-order-table">
                    <thead>
                        <tr>
                            <th>{lbl.colProduct}</th>
                            <th>{lbl.colCode}</th>
                            <th>{lbl.colQty}</th>
                            <th>{lbl.colUnitPrice}</th>
                            <th>{lbl.colTotalPrice}</th>
                            <th>{lbl.colChargeType}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={orderLines} for:item="line">
                            <tr key={line.id}>
                                <td>{line.name}</td>
                                <td><span class="cpq-search-code">{line.productCode}</span></td>
                                <td>{line.quantity}</td>
                                <td>{line.unitPrice} {selectedCurrency}</td>
                                <td><strong>{line.totalPrice} {selectedCurrency}</strong></td>
                                <td>{line.chargeType}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
            <template if:false={hasOrderLines}>
                <div class="cpq-search-empty">
                    <p>{lbl.loadingMsg}</p>
                </div>
            </template>
        </div>

        <!-- ORDER TOTALS -->
        <div class="cpq-order-totals slds-m-top_medium">
            <div class="cpq-summary-row cpq-grand-total">
                <span>{lbl.orderTotalLabel}</span>
                <strong>{orderTotalAmount} {selectedCurrency}</strong>
            </div>
        </div>

        <!-- MARK CONTRACTED — Step 5: enabled only when Order is Activated -->
        <div class="cpq-contract-action-block slds-m-top_large">
            <div class="cpq-summary-divider"></div>
            <template if:false={isContracted}>
                <div class="cpq-contract-action-label slds-m-top_medium">
                    <lightning-icon icon-name="utility:contract" size="small" class="slds-m-right_x-small"></lightning-icon>
                    <template if:true={isOrderActivated}>
                        {lbl.orderActivatedForContract}
                    </template>
                    <template if:false={isOrderActivated}>
                        {lbl.activateFirstMsg}
                    </template>
                </div>
                <template if:true={isOrderStatusChanged}>
                    <p style="color:#f44336; font-size:11px; font-weight:700; margin-top:8px;">
                        <lightning-icon icon-name="utility:warning" size="xx-small" class="slds-m-right_xx-small" variant="error"></lightning-icon>
                        {lbl.saveStatusWarning}
                    </p>
                </template>
                <lightning-button label={lbl.markContractedBtn} variant="brand" icon-name="utility:contract" onclick={handleMarkContracted} disabled={isMarkContractedDisabled} class="slds-m-top_small">
                </lightning-button>
            </template>

            <!-- CONTRACT GENERATED CONFIRMATION -->
            <template if:true={isContracted}>
                <div class="cpq-contract-success-panel slds-m-top_medium">
                    <lightning-icon icon-name="utility:success" size="medium" class="slds-m-right_small" style="color:#00AF91;"></lightning-icon>
                    <div>
                        <div class="cpq-contract-success-title">{lbl.contractCreatedMsg}</div>
                        <div class="cpq-contract-success-meta">
                            {lbl.contractPrefix} <strong>{contractNumber}</strong> {lbl.contractStatusSep}
                            <span class="cpq-status-badge">{contractStatus}</span>
                        </div>
                        <button type="button" class="cpq-link-btn slds-m-top_x-small" onclick={handleGoToContract}>
                            {lbl.openContractLink}
                        </button>
                    </div>
                </div>
            </template>
        </div>

        <!-- SPINNER & ALERTS (Order View) -->
        <template if:true={isLoading}>
            <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                <lightning-spinner alternative-text={lbl.loadingMsg} size="medium"></lightning-spinner>
            </div>
        </template>
        <template if:true={errorMessage}>
            <div class="cpq-alert cpq-alert-error slds-m-top_small" role="alert">
                <lightning-icon icon-name="utility:error" size="small"></lightning-icon>
                <span>{errorMessage}</span>
            </div>
        </template>
        <template if:true={successMessage}>
            <div class="cpq-alert cpq-alert-success slds-m-top_small" role="alert">
                <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                <span>{successMessage}</span>
            </div>
        </template>
    </div>
</template>
